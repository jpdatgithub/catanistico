<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MeuCatan.MudblazorWasmClient</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="MeuCatan.MudblazorWasmClient.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        window.getElementBounds = (el) => {
            const r = el.getBoundingClientRect();
            return { width: r.width, height: r.height };
        };

        window.audioCues = (() => {
            const audioByCue = new Map();
            const sources = {
                "sua-vez": "audio/sua-vez.mp3",
                "dados-rolados": "audio/dados-rolando.mp3",
                "troca-proposta": "audio/troca-proposta.mp3",
                "ladrao": "audio/ladrao.mp3"
            };

            function getAudio(cueName) {
                let audio = audioByCue.get(cueName);
                if (!audio) {
                    audio = new Audio(sources[cueName]);
                    audio.preload = "auto";
                    audioByCue.set(cueName, audio);
                }

                return audio;
            }

            function unlock() {
                for (const cueName of Object.keys(sources)) {
                    const audio = getAudio(cueName);
                    audio.muted = true;
                    void audio.play().then(() => {
                        if (!audio.muted) {
                            return;
                        }

                        audio.pause();
                        audio.currentTime = 0;
                        audio.muted = false;
                    }).catch(() => {
                        audio.muted = false;
                    });
                }
            }

            function play(cueName) {
                const source = sources[cueName];
                if (!source) {
                    return;
                }

                const audio = getAudio(cueName);

                audio.muted = false;
                audio.pause();
                audio.currentTime = 0;
                void audio.play().catch(() => { });
            }

            document.addEventListener("pointerdown", unlock, { once: true });
            return { play };
        })();
    </script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
